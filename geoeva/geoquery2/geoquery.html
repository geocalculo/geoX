<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoQuery | GeoEVA</title>
  <script>
    (function redirectToOfficialGeoQuery() {
      const target = new URL("../geoquery/geoquery.html", window.location.href);
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        target.searchParams.append(key, value);
      }
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    }());
  </script>
</head>
<body>
  <p>Redirigiendo a <a id="official-link" href="../geoquery/geoquery.html">GeoQuery</a>…</p>
  <script>document.getElementById("official-link").href = new URL("../geoquery/geoquery.html" + window.location.search + window.location.hash, window.location.href).toString();</script>
</body>
</html>
