<body>
  <div id="app">
    <header id="main-header"><div class="brand-block"><div id="site-title">GeoEVA</div><div id="site-subtitle">Evaluación Ambiental Territorial</div><p id="site-description">Explorador territorial para proyectos sometidos a evaluación ambiental, contexto geográfico y análisis de entorno.</p></div><div id="summary-bar"><div class="summary-item" data-summary-id="total_proyectos"><span class="summary-value">0</span><span class="summary-label">Proyectos</span></div><div class="summary-item" data-summary-id="total_inversion"><span class="summary-value">0</span><span class="summary-label">Inversión</span></div><div class="summary-item" data-summary-id="sector_dominante"><span class="summary-value">Sin datos</span><span class="summary-label">Sector dominante</span></div><div class="summary-item" data-summary-id="proyectos_aprobados"><span class="summary-value">0</span><span class="summary-label">Aprobados</span></div><div class="summary-item" data-summary-id="proyectos_rechazados"><span class="summary-value">0</span><span class="summary-label">Rechazados</span></div></div></header>
    <section id="control-bar"><select id="country-selector"><option value="CL">Chile</option></select><select id="region-selector"><option value="">Todas las regiones</option></select><button id="btn-search">Buscar</button><button id="btn-clear">Limpiar</button><a class="home-link" href="../index.html">GeoX</a></section>
    <main id="main-layout"><aside id="territorial-panel"><div class="panel-layer-controls" aria-label="Control de etiquetas GeoEVA"></div></aside><section id="map-container"><div id="search-box-wrapper"><input id="search-box" type="text" placeholder="Buscar territorio, objeto o capa..." autocomplete="off" /><div id="search-results"></div></div><div id="map"></div><div id="mobile-map-controls"><div class="map-toggle"><button id="btn-osm" class="map-toggle-btn active" data-map="osm" aria-pressed="true">OSM</button><button id="btn-sat" class="map-toggle-btn" data-map="sat" aria-pressed="false">SAT</button></div><button id="btn-my-location" title="Centrar en mi ubicación">📍</button><button id="mobile-layer-toggle" class="mobile-layer-toggle is-inactive" type="button" aria-pressed="false" aria-label="Mostrar etiquetas" title="Mostrar etiquetas"><span class="mobile-layer-toggle-icon" aria-hidden="true"><svg class="mobile-layer-toggle-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2.5 12s3.5-6 9.5-6c2.1 0 3.9.72 5.36 1.7M21.5 12s-3.5 6-9.5 6c-2.1 0-3.9-.72-5.36-1.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 9.8A3 3 0 0 1 14.2 14.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span><span class="mobile-layer-toggle-text">Etiquetas</span></button></div></section></main>

  </div>
