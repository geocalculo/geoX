name: Actualizar catálogo de estudios

on:
  push:
    paths:
      - 'estudios/**'

permissions:
  contents: write

jobs:
  actualizar-catalogo:
    if: "${{ github.event.head_commit.message != 'chore(estudios): actualizar catalogo' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generar catálogo
        run: node estudios/tools/build-catalogo.js

      - name: Publicar catálogo si cambió
        run: |
          if git diff --quiet -- estudios/catalogo.json; then
            echo "El catálogo ya está actualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estudios/catalogo.json
          git commit -m "chore(estudios): actualizar catalogo"
          git push origin HEAD:${{ github.ref_name }}
