<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GeoX - GeoFactory</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <div id="app">

    <!-- HEADER -->
    <header id="main-header">
      <div class="brand-block">
        <div id="site-title">GeoX</div>
        <div id="site-subtitle">Molde territorial genérico</div>
      </div>

      <div id="summary-bar">
        <div class="summary-item">
          <span class="summary-value">0</span>
          <span class="summary-label">Objetos visibles</span>
        </div>
        <div class="summary-item">
          <span class="summary-value">0</span>
          <span class="summary-label">Capas activas</span>
        </div>
        <div class="summary-item">
          <span class="summary-value">GeoX</span>
          <span class="summary-label">Modo</span>
        </div>
      </div>

    </header>

    <!-- BARRA SUPERIOR DE CONTROL -->
    <section id="control-bar">
      <select id="country-selector">
        <option value="CL">Chile</option>
      </select>

      <select id="region-selector">
        <option value="03">Región de Atacama</option>
      </select>

      <button id="btn-search">Buscar</button>
      <button id="btn-clear">Limpiar</button>
    </section>

    <!-- CUERPO PRINCIPAL -->
    <main id="main-layout">

      <!-- PANEL TERRITORIAL -->
      <aside id="territorial-panel">
        <h3 id="panel-title">Panel Territorial</h3>

        <!-- GEOFACTORY PANEL TERRITORIAL -->
        <div class="panel-section panel-territorial-control">
          <label class="toggle-row" for="toggle-perimetros-ipt">
            <input id="toggle-perimetros-ipt" type="checkbox" />
            <span>Perímetros IPT</span>
          </label>
        </div>
      </aside>

      <!-- MAPA -->
      <section id="map-container">
        <!-- GEOFACTORY SEARCH SOBRE MAPA -->
        <div id="search-box-wrapper">
          <input
            id="search-box"
            type="text"
            placeholder="Buscar territorio, objeto o capa..."
            autocomplete="off"
          />
          <div id="search-results" role="listbox" aria-label="Resultados de búsqueda"></div>
        </div>

        <div id="map"></div>
        <div id="map-toggle" class="map-toggle">
          <button id="btn-osm" class="map-toggle-btn active" data-map="osm">OSM</button>
          <button id="btn-sat" class="map-toggle-btn" data-map="sat">SAT</button>
        </div>
        <button id="btn-my-location" title="Centrar en mi ubicación" aria-label="Centrar en mi ubicación">
          📍
        </button>
      </section>

    </main>

    <!-- FOOTER -->
    <footer id="main-footer">
      GeoFactory · GeoX · Fase 1 Index
    </footer>

  </div>

  <!-- Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- JS propio -->
  <script src="js/index.js"></script>
</body>
</html>
